name: desktop-package

on:
  workflow_dispatch:
  push:
    paths:
      - 'writeit-v2/**'

jobs:
  windows-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: writeit-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: writeit-v2/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: mkdir -p artifacts && tar -cf artifacts/writeit-v2-windows-package.tar dist
      - uses: actions/upload-artifact@v4
        with:
          name: writeit-v2-windows-package
          path: writeit-v2/artifacts/writeit-v2-windows-package.tar
