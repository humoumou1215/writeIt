<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milkdown 最简 Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #1f2329;
    }
    header {
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid #e5e6eb;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; margin: 0; }
    header .sub { color: #8a8f99; font-size: 13px; }
    .toolbar { margin-left: auto; display: flex; gap: 8px; }
    button {
      border: 1px solid #d0d3d9; background: #fff; color: #1f2329;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #f2f3f5; }
    main { max-width: 820px; margin: 24px auto; padding: 0 16px; }
    #editor {
      background: #fff; border: 1px solid #e5e6eb; border-radius: 10px;
      min-height: 420px; padding: 8px 16px;
    }
    pre#out {
      margin-top: 16px; background: #1f2329; color: #d6e2ff;
      padding: 14px 16px; border-radius: 10px; font-size: 13px;
      white-space: pre-wrap; word-break: break-all; display: none;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Milkdown 最简 Demo</h1>
      <div class="sub">基于 @milkdown/crepe 的所见即所得 Markdown 编辑器</div>
    </div>
    <div class="toolbar">
      <button id="export">导出 Markdown</button>
      <button id="readonly">切换只读</button>
    </div>
  </header>

  <main>
    <div id="editor"></div>
    <pre id="out"></pre>
  </main>

  <script type="module">
    import { Crepe } from "https://esm.sh/@milkdown/crepe@7.22.0";
    import "https://esm.sh/@milkdown/crepe@7.22.0/theme/classic.css";

    const crepe = new Crepe({
      root: "#editor",
      defaultValue:
        "# 你好，Milkdown 👋\n\n" +
        "这是一个**最简单**的 Milkdown 编辑器 Demo。你可以：\n\n" +
        "- 直接在这里输入文字\n" +
        "- 选中文字后使用悬浮*工具栏*\n" +
        "- 支持 `代码`、[链接](https://milkdown.dev)、列表、表格等\n\n" +
        "> 试试在空行输入 `/` 唤起快捷指令。",
    });

    await crepe.create();

    const out = document.getElementById("out");
    document.getElementById("export").addEventListener("click", () => {
      const md = crepe.getMarkdown();
      out.textContent = md;
      out.style.display = "block";
    });

    let readonly = false;
    document.getElementById("readonly").addEventListener("click", (e) => {
      readonly = !readonly;
      crepe.setReadonly(readonly);
      e.target.textContent = readonly ? "退出只读" : "切换只读";
    });
  </script>
</body>
</html>
