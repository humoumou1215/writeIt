name: Build Windows Installer

# 触发条件：
#   - 推送 main 分支
#   - 推送 v* 标签（自动发 GitHub Release）
#   - 手动触发（Actions 页面 Run workflow）
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: editor-app
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor-app/package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: editor-app/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer (NSIS)
        run: npm run tauri build
        env:
          # Tauri 上传/遥测提示静默
          TAURI_SKIP_DEVSERVER_CHECK: 'true'

      - name: List bundle output
        run: ls -R src-tauri/target/release/bundle | head -30

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: milkdown-note-windows-setup
          path: editor-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 推 v* 标签时自动发布到 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: editor-app/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
