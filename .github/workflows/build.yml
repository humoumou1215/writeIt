name: Build & Release

# 触发条件：仅在推送 tag 时触发（不再监听分支 push）。
# 通过不同的 tag 后缀控制打哪个平台的包：
#   - vX.Y.Z-mac  → 仅 macOS（Intel + Apple Silicon 的 .app + DMG）
#   - vX.Y.Z-win  → 仅 Windows（NSIS 安装包 + 免安装便携版）
#   - vX.Y.Z  / vX.Y.Z-all → 两个平台都打（默认）
# 发布 Release 时，-mac/-win 后缀会被剥离，使同一版本号的多平台产物
# 合并到同一个 GitHub Release（如 v1.0.0-mac 与 v1.0.0-win 都归到 v1.0.0）。
on:
  push:
    tags:
      - 'v*'

# 也可在 Actions 页面手动触发（默认打两个平台），便于测试。
  workflow_dispatch:
    inputs:
      platform:
        description: '要打的平台 (mac / win / all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win

jobs:
  # 根据 tag 后缀决定本次构建哪个平台，并输出对应的构建矩阵。
  filter:
    name: Resolve platforms from tag
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      release_tag: ${{ steps.set.outputs.release_tag }}
    steps:
      - name: Resolve target platforms
        id: set
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PLATFORM="${{ inputs.platform }}"

          # 手动触发时用输入值；否则从 tag 后缀推断
          if [ -n "$PLATFORM" ]; then
            TARGET="$PLATFORM"
          elif [[ "$TAG" == *-mac ]]; then
            TARGET="mac"
          elif [[ "$TAG" == *-win ]]; then
            TARGET="win"
          else
            TARGET="all"
          fi

          case "$TARGET" in
            mac)
              echo "-> macOS only"
              MATRIX='[
                {"os":"macos-15-intel","arch":"x64","timeout":90,"bundles":"app,dmg"},
                {"os":"macos-14","arch":"arm64","timeout":90,"bundles":"app,dmg"}
              ]'
              ;;
            win)
              echo "-> Windows only"
              MATRIX='[
                {"os":"windows-latest","arch":"x64","timeout":60,"bundles":"nsis"}
              ]'
              ;;
            *)
              echo "-> all platforms"
              MATRIX='[
                {"os":"windows-latest","arch":"x64","timeout":60,"bundles":"nsis"},
                {"os":"macos-15-intel","arch":"x64","timeout":90,"bundles":"app,dmg"},
                {"os":"macos-14","arch":"arm64","timeout":90,"bundles":"app,dmg"}
              ]'
              ;;
          esac

          # 剥离 -mac/-win 后缀作为 Release 的版本号（同一版本的多平台产物合并）
          RELEASE_TAG="${TAG%-mac}"
          RELEASE_TAG="${RELEASE_TAG%-win}"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG target=$TARGET release_tag=$RELEASE_TAG"

  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    needs: filter
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不取消其他平台
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.filter.outputs.matrix) }}
    permissions:
      # 上传 Artifacts 需要 contents 写权限
      contents: write
    defaults:
      run:
        working-directory: editor-app
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor-app/package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: editor-app/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 按平台打包（tauri.conf.json 的 bundle.targets 也是跨平台列表，
      # 这里用 --bundles 显式指定当前平台要打的包）
      - name: Build bundles (${{ matrix.bundles }})
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          TAURI_SKIP_DEVSERVER_CHECK: 'true'
          # --- 正式签名（可选，配置后可去除注释启用）---
          # 需要 Apple Developer 证书（P12 -> base64 存 secret）。
          # 未配置时产物未签名，可正常分发；如需过 Gatekeeper 还需 notarization。
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: List bundle output
        run: ls -R src-tauri/target/release/bundle | head -40

      # ---- Windows：免安装便携版 ----
      # Tauri 2 的 release exe 是自包含单文件（前端已内嵌，WebView2 为系统组件），
      # 直接 zip 即为免安装版。
      - name: Create Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/writeit.exe portable/writeit.exe
          Compress-Archive -Path portable/writeit.exe -DestinationPath "writeit_${ver}_${{ matrix.arch }}_portable.zip" -Force

      - name: Upload Windows installer (NSIS)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: writeit-windows-setup
          path: editor-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows portable zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: writeit-windows-portable
          path: editor-app/writeit_*_portable.zip
          if-no-files-found: error

      # ---- macOS：只上传 DMG ----
      # .app 已完整包含在 DMG 内；不再另传 .app.zip 绿色版（否则同一 App 两种格式
      # 进同一 artifact，体积几乎翻倍；需要绿色版可自行解包 DMG 内的 .app）。
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: writeit-macos-${{ matrix.arch }}
          path: editor-app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 构建完成后统一发布 GitHub Release。
  # 独立 job 等所有平台构建完成后统一上传，避免多平台并发写 Release 冲突。
  # 使用剥离后缀后的版本号作为 tag_name，使 -mac/-win 的多平台产物合并到同一 Release。
  release:
    name: Create GitHub Release
    needs: [filter, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -R release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.filter.outputs.release_tag }}
          files: release/*
          generate_release_notes: true
