name: Build & Release

# 触发条件：
#   - 推送 master 分支（仅构建 + 上传 Artifacts）
#   - 推送 v* 标签（构建 + 自动发布 GitHub Release）
#   - 手动触发（Actions 页面 Run workflow）
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不取消其他平台
      fail-fast: false
      matrix:
        include:
          # Windows x64：NSIS 安装包 + 免安装便携版（单 exe zip）
          - os: windows-latest
            arch: x64
            timeout: 60
            bundles: nsis
          # macOS Intel (x64)：.app + DMG
          - os: macos-13
            arch: x64
            timeout: 90
            bundles: app,dmg
          # macOS Apple Silicon (arm64)：.app + DMG
          - os: macos-14
            arch: arm64
            timeout: 90
            bundles: app,dmg
    permissions:
      # 发布 GitHub Release 需要 contents 写权限
      contents: write
    defaults:
      run:
        working-directory: editor-app
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor-app/package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: editor-app/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 按平台打包（tauri.conf.json 的 bundle.targets 也是跨平台列表，
      # 这里用 --bundles 显式指定当前平台要打的包）
      - name: Build bundles (${{ matrix.bundles }})
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          TAURI_SKIP_DEVSERVER_CHECK: 'true'
          # --- 正式签名（可选，配置后可去除注释启用）---
          # 需要 Apple Developer 证书（P12 -> base64 存 secret）。
          # 未配置时产物未签名，可正常分发；如需过 Gatekeeper 还需 notarization。
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: List bundle output
        run: ls -R src-tauri/target/release/bundle | head -40

      # ---- Windows：免安装便携版 ----
      # Tauri 2 的 release exe 是自包含单文件（前端已内嵌，WebView2 为系统组件），
      # 直接 zip 即为免安装版。
      - name: Create Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/milkdown-note.exe portable/milkdown-note.exe
          Compress-Archive -Path portable/milkdown-note.exe -DestinationPath "milkdown-note_${ver}_${{ matrix.arch }}_portable.zip" -Force

      - name: Upload Windows installer (NSIS)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: milkdown-note-windows-setup
          path: editor-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows portable zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: milkdown-note-windows-portable
          path: editor-app/milkdown-note_*_portable.zip
          if-no-files-found: error

      # ---- macOS：压缩 .app（除 DMG 外的绿色版），随 DMG 一起上传 ----
      - name: Create macOS .app zip
        if: runner.os == 'macOS'
        run: |
          app_path=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "milkdown-note-macos-${{ matrix.arch }}.app.zip"

      - name: Upload macOS bundles (.app + DMG)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: milkdown-note-macos-${{ matrix.arch }}
          path: |
            editor-app/src-tauri/target/release/bundle/dmg/*.dmg
            editor-app/milkdown-note-macos-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  # 推送 v* 标签时发布 GitHub Release。
  # 独立 job 等所有平台构建完成后统一上传，避免多平台并发写 Release 冲突。
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -R release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
