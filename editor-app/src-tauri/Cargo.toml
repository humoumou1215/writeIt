[package]
name = "writeit"
version = "0.1.0"
description = "WriteIt - Markdown 编辑器（Tauri + Vue + Crepe）"
edition = "2021"

[lib]
name = "writeit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
